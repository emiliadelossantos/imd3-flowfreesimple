<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>FlowFree GenZ Version</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <div id="home" class="screen">
      <h1>FlowFree <span>GenZ Version</span></h1>
      <button id="go-level1">Level 1 · 4 colors</button>
      <button id="go-level2">Level 2 · 6 colors</button>
    </div>

    <div id="game" class="screen hidden">
      <h2 id="level-title"></h2>
      <p id="message"></p>
      <div id="board"></div>
      <div class="buttons">
        <button id="restart">Restart level</button>
        <button id="next" class="hidden">Next level</button>
        <button id="home-btn">Home</button>
      </div>
    </div>

    <script src="js/main.js" type="module"></script>
  </body>
</html>
